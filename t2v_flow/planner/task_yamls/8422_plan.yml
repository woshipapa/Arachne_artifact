tasks:
# ====================================================================
# Each FULL task is split into a VAE stage and a DIT stage
# 1. VAE stage: encoding; no dependencies.
# 2. DIT stage: training; depends on the matching VAE task.
# ====================================================================

# --------------------------------------------------------------------
# Task group 1: formerly D_13_720p_FULL_g01
# --------------------------------------------------------------------
- name: D_13_720p_VAE_g01 # VAE stage
  gpus: [ 0, 1 ]
  dependencies: []
  args:
    task_type: VAE
    sp: 2
    # ... other model or data parameters

- name: D_13_720p_DIT_g01 # DIT stage
  gpus: [ 0, 1 ]
  dependencies: [ "D_13_720p_VAE_g01" ] # depends on the VAE task above
  args:
    task_type: DIT
    sp: 2
    data_source_task: "D_13_720p_VAE_g01" # the task supplying the data

# --------------------------------------------------------------------
# Task group 2: formerly D_129_720p_FULL_g23
# --------------------------------------------------------------------
- name: D_129_720p_VAE_g23 # VAE stage
  gpus: [ 8,9,10,11,12,13,14,15 ]
  dependencies: []
  args:
    task_type: VAE
    sp: 2

- name: D_129_720p_DIT_g23 # DIT stage
  gpus: [ 8,9,10,11,12,13,14,15 ]
  dependencies: [ "D_129_720p_VAE_g23" ]
  args:
    task_type: DIT
    sp: 2
    data_source_task: "D_129_720p_VAE_g23" # the task supplying the data

# --------------------------------------------------------------------
# Task group 3: formerly D_89_720p_FULL_g6
# --------------------------------------------------------------------
- name: D_89_720p_VAE_g6 # VAE stage
  gpus: [ 4,5, 6, 7 ]
  dependencies: []
  args:
    task_type: VAE
    sp: 2

- name: D_89_720p_DIT_g6 # DIT stage
  gpus: [ 4, 5, 6, 7 ]
  dependencies: [ "D_89_720p_VAE_g6" ]
  args:
    task_type: DIT
    sp: 2
    data_source_task: "D_89_720p_VAE_g6" # the task supplying the data

# --------------------------------------------------------------------
# Task group 4: formerly D_57_FULL_g7
# --------------------------------------------------------------------
- name: D_57_VAE_g7 # VAE stage
  gpus: [ 2,3 ]
  dependencies: []
  args:
    task_type: VAE
    sp: 2

- name: D_57_DIT_g7 # DIT stage
  gpus: [ 2,3 ]
  dependencies: [ "D_57_VAE_g7" ]
  args:
    task_type: DIT
    sp: 2
    data_source_task: "D_57_VAE_g7" # the task supplying the data
