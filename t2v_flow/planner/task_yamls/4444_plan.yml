tasks:
# ====================================================================
# Each task group uses 4 GPUs, assigned in order
# 1. VAE stage: encoding; no dependencies.
# 2. DIT stage: training; depends on the matching VAE task.
# ====================================================================

# --------------------------------------------------------------------
# Task group 1: formerly D_13_720p_FULL
# --------------------------------------------------------------------
- name: D_13_720p_VAE_g0123  # VAE stage
  gpus: [ 0, 1, 2, 3 ]
  dependencies: []
  args:
    task_type: VAE
    sp: 2
    # ... other model or data parameters

- name: D_13_720p_DIT_g0123  # DIT stage
  gpus: [ 0, 1, 2, 3 ]
  dependencies: [ "D_13_720p_VAE_g0123" ] # depends on the VAE task above
  args:
    task_type: DIT
    sp: 2
    data_source_task: "D_13_720p_VAE_g0123"  # the task supplying the data

