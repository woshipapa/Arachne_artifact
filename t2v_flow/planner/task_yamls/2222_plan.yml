tasks:
# ====================================================================
# [修改后] 将每个 FULL 任务拆分为 VAE 和 DIT 两个阶段
# 1. VAE 阶段: 负责编码，无依赖。
# 2. DIT 阶段: 负责训练，依赖于对应的 VAE 任务完成。
# ====================================================================

# --------------------------------------------------------------------
# 任务组 1: 原 D_13_720p_FULL_g01
# --------------------------------------------------------------------
- name: D_13_720p_VAE_g01  # VAE 阶段
  gpus: [ 0, 1 ]
  dependencies: []
  args:
    task_type: VAE
    sp: 2
    # ... 其他模型或数据参数

- name: D_13_720p_DIT_g01  # DIT 阶段
  gpus: [ 0, 1 ]
  dependencies: [ "D_13_720p_VAE_g01" ] # 依赖于上面的 VAE 任务
  args:
    task_type: DIT
    sp: 2
    data_source_task: "D_13_720p_VAE_g01"  # 指定数据源任务

# --------------------------------------------------------------------
# 任务组 2: 原 D_129_720p_FULL_g23
